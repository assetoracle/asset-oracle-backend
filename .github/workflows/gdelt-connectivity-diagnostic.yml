name: GDELT Connectivity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-oracle-gdelt-connectivity-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-gdelt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Diagnose DNS, TLS and historical GDELT endpoint
        run: node scripts/diagnose-gdelt-connectivity.mjs
