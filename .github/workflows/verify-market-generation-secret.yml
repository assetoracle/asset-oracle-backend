name: Read-only market generation secret verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-market-generation-secret-verification
  cancel-in-progress: false

jobs:
  verify-secret:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify market generation secret without revealing it
        env:
          MARKET_GENERATION_TEMPLATES_JSON: ${{ secrets.MARKET_GENERATION_TEMPLATES_JSON }}
        run: node scripts/verify-market-generation-secret.mjs
