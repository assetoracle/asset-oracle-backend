name: Asset Oracle Testnet Market Lifecycle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-oracle-market-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTOMATION_PRIVATE_KEY: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AUTOMATION_PRIVATE_KEY" ]; then
            echo 'Required Actions secrets are missing.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev && npm run build
      - name: Run testnet lifecycle worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTOMATION_PRIVATE_KEY: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
          ASSET_CHAIN_RPC_URL: https://enugu-rpc.assetchain.org
          ASSET_CHAIN_ID: '42421'
          ASSET_CHAIN_EXPLORER_URL: https://scan-testnet.assetchain.org
        run: npm run automate:market-lifecycle
