name: Testnet market lifecycle trigger

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-oracle-testnet-market-lifecycle-trigger
  cancel-in-progress: false

jobs:
  trigger-testnet-worker:
    # Keep the schedule dormant until the staging trigger endpoint is deployed
    # and the owner explicitly enables this repository variable.
    if: vars.ENABLE_TESTNET_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate trigger configuration
        env:
          AUTOMATION_TRIGGER_URL: ${{ secrets.TESTNET_AUTOMATION_TRIGGER_URL }}
          AUTOMATION_TRIGGER_TOKEN: ${{ secrets.TESTNET_AUTOMATION_TRIGGER_TOKEN }}
        run: |
          test -n "$AUTOMATION_TRIGGER_URL" || { echo "::error::Missing TESTNET_AUTOMATION_TRIGGER_URL repository secret"; exit 1; }
          test -n "$AUTOMATION_TRIGGER_TOKEN" || { echo "::error::Missing TESTNET_AUTOMATION_TRIGGER_TOKEN repository secret"; exit 1; }

      - name: Trigger the testnet lifecycle worker
        env:
          AUTOMATION_TRIGGER_URL: ${{ secrets.TESTNET_AUTOMATION_TRIGGER_URL }}
          AUTOMATION_TRIGGER_TOKEN: ${{ secrets.TESTNET_AUTOMATION_TRIGGER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $AUTOMATION_TRIGGER_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"source":"github-actions","network":"asset-chain-enugu-testnet"}' \
            "$AUTOMATION_TRIGGER_URL"
