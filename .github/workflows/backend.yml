name: Asset Oracle Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: TypeScript Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Read-only Enugu USDC and candidate treasury preflight
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/rebase-paid-submission-lifecycle'
        env:
          ASSET_ORACLE_TESTNET_RPC_URL: https://enugu-rpc.assetchain.org
          ASSET_ORACLE_TESTNET_USDC_ADDRESS: 0xc33741fddEBeA854d265db6F9707900Efb0211a2
          ASSET_ORACLE_TESTNET_PAID_SUBMISSION_TREASURY_ADDRESS: 0x650fBE31b1710b27Ea9eBe03862BC93145Fb3d77
        run: npx tsx scripts/verify-enugu-paid-submission-preflight.ts
