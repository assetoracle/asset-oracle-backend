name: Backend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit resolved dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2)); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n + ': ' + v.severity + ' via ' + JSON.stringify(v.via));"
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
