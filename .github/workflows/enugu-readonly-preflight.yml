name: Enugu Read-Only Contract Preflight

on:
  push:
    branches:
      - "audit/enugu-readonly-preflight-2026-10-21"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      ASSET_ORACLE_MARKET_MANAGER_ADDRESS: "0x5fc327f55cf533ed5d05337f835be37ff1e0db1f"
      ASSET_CHAIN_RPC_URL: "https://enugu-rpc.assetchain.org"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install contract test dependencies
        run: npm install --include=dev
      - name: Run local smart-contract test suite
        run: npm test
      - name: Run read-only Enugu preflight
        run: npm run preflight:enugu
      - name: Smoke-test deployed backend health and database
        working-directory: .
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 5 https://asset-oracle-backend.onrender.com/api/health
          echo
          curl --fail --show-error --silent --retry 3 --retry-delay 5 https://asset-oracle-backend.onrender.com/api/health/database
          echo
      - name: Verify deployed public role configuration
        working-directory: .
        shell: bash
        run: |
          check_role() {
            local address="$1"
            local expected="$2"
            local response
            response="$(curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              -H 'Content-Type: application/json' \
              -d "$(printf '{"address":"%s"}' "$address")" \
              https://asset-oracle-backend.onrender.com/api/markets/auth/role/public)"
            printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const result = JSON.parse(input);
                if (result.role !== process.argv[1]) {
                  console.error("Role mismatch: expected " + process.argv[1] + ", received " + result.role);
                  process.exit(1);
                }
                console.log("PASS deployed role " + result.role + " for " + result.address);
              });
            ' "$expected"
          }
          check_role "0x3d3724d20d9d5db5a40819869057b37465a0c67d" "OWNER"
          check_role "0xb94185491c78e7331c5d53e9b0df74970b3c9b8a" "VALIDATOR_2"
          check_role "0xb23c61d8506d1cfbc27d56834e6d684b8ee24f01" "VALIDATOR_3"
      - name: Smoke-test deployed frontend
        working-directory: .
        run: curl --fail --show-error --silent --head --retry 3 --retry-delay 5 https://asset-oracle.onrender.com
