name: Backend Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/referral-stats-api

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTOMATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/automation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
