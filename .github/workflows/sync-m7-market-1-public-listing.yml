name: Sync M7 market 1 public listing

on:
  workflow_dispatch:
    inputs:
      confirm_sync:
        description: 'Type SYNC_M7_MARKET_1 to authorize the database listing sync'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asset-oracle-m7-market-1-db-sync
  cancel-in-progress: false

jobs:
  sync-public-listing:
    if: github.ref == 'refs/heads/main' && inputs.confirm_sync == 'SYNC_M7_MARKET_1'
    runs-on: ubuntu-latest
    environment: asset-oracle-testnet
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify on-chain publication and sync public database record
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASSET_CHAIN_RPC_URL: https://enugu-rpc.assetchain.org
        run: npx tsx scripts/sync-m7-market-1-public-listing.ts
