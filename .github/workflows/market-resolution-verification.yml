name: Market Resolution Verification

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-oracle-market-resolution-verification
  cancel-in-progress: false

jobs:
  prepare-resolution-recommendations:
    if: github.ref == 'refs/heads/main' && vars.MARKET_RESOLUTION_VERIFICATION_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: asset-oracle-testnet
    timeout-minutes: 8
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Fetch fresh resolution evidence and prepare validator recommendations
        run: npm run automate:market-resolution-verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          MARKET_RESOLUTION_VERIFICATION_WORKER_ENABLED: "true"
          MARKET_RESOLUTION_MAX_PER_RUN: "10"
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
