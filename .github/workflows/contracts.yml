name: Asset Oracle Contract Checks

on:
  pull_request:
    paths:
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - "contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm install
      - name: Report high-severity contract-tooling advisories
        run: |
          npm audit --json > /tmp/contract-audit.json || true
          node -e 'const r=require("/tmp/contract-audit.json"); const rank={low:1,moderate:2,high:3,critical:4}; const high=Object.entries(r.vulnerabilities||{}).filter(([,v])=>rank[v.severity]>=3).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url})})); console.log(JSON.stringify({summary:r.metadata?.vulnerabilities,highAndCritical:high},null,2));'
      - run: npm run compile
      - run: npm test
