name: Deploy Enugu Consensus Manager

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enugu-consensus-contract-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and configure on Enugu testnet
    if: github.ref == 'refs/heads/main'
    environment: enugu-testnet-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      ASSET_CHAIN_RPC_URL: https://enugu-rpc.assetchain.org
      OWNER_WALLET_ADDRESS: ${{ vars.ENUGU_OWNER_WALLET_ADDRESS }}
      TREASURY_ADDRESS: ${{ vars.ENUGU_TREASURY_ADDRESS }}
      VALIDATOR_REWARD_POOL_ADDRESS: ${{ vars.ENUGU_VALIDATOR_REWARD_POOL_ADDRESS }}
      ORACLE_RESOLVER_ADDRESS: ${{ vars.ENUGU_ORACLE_RESOLVER_ADDRESS }}
      USDC_TOKEN_ADDRESS: ${{ vars.ENUGU_USDC_TOKEN_ADDRESS }}
      USDC_TOKEN_DECIMALS: ${{ vars.ENUGU_USDC_TOKEN_DECIMALS }}
      AUTOMATED_MARKET_CREATOR_WALLET_ADDRESS: ${{ vars.ENUGU_AUTOMATED_MARKET_CREATOR_WALLET_ADDRESS }}
      MARKET_CREATOR_WALLET_ADDRESSES: ${{ vars.ENUGU_MARKET_CREATOR_WALLET_ADDRESSES }}
      VALIDATOR_WALLET_1: ${{ vars.ENUGU_VALIDATOR_WALLET_1 }}
      VALIDATOR_WALLET_2: ${{ vars.ENUGU_VALIDATOR_WALLET_2 }}
      VALIDATOR_WALLET_3: ${{ vars.ENUGU_VALIDATOR_WALLET_3 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile contract source
        run: npm run compile
      - name: Deploy, configure validators, and transfer ownership
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.ENUGU_DEPLOYER_PRIVATE_KEY }}
        run: |
          required_vars=(OWNER_WALLET_ADDRESS TREASURY_ADDRESS VALIDATOR_REWARD_POOL_ADDRESS ORACLE_RESOLVER_ADDRESS USDC_TOKEN_ADDRESS USDC_TOKEN_DECIMALS AUTOMATED_MARKET_CREATOR_WALLET_ADDRESS VALIDATOR_WALLET_1 VALIDATOR_WALLET_2 VALIDATOR_WALLET_3)
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub environment variable: $name"
              exit 1
            fi
          done
          if [[ -z "$DEPLOYER_PRIVATE_KEY" ]]; then
            echo "::error::Missing environment secret ENUGU_DEPLOYER_PRIVATE_KEY."
            exit 1
          fi
          npm run deploy:enugu
