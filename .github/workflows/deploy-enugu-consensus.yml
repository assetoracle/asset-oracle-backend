name: Deploy Enugu Consensus Manager

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enugu-consensus-contract-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and configure on Enugu testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      DEPLOYER_PRIVATE_KEY: ${{ secrets.ENUGU_DEPLOYER_PRIVATE_KEY }}
      ASSET_CHAIN_RPC_URL: https://enugu-rpc.assetchain.org
      OWNER_WALLET_ADDRESS: 0x3d3724d20d9d5db5a40819869057b37465a0c67d
      TREASURY_ADDRESS: 0x650fBE31b1710b27Ea9eBe03862BC93145Fb3d77
      VALIDATOR_REWARD_POOL_ADDRESS: 0xb86e97b85e816ed0fe170a2dc3b5558232792553
      ORACLE_RESOLVER_ADDRESS: 0x3d3724d20d9d5db5a40819869057b37465a0c67d
      USDC_TOKEN_ADDRESS: 0xc33741fddEBeA854d265db6F9707900Efb0211a2
      USDC_TOKEN_DECIMALS: "6"
      VALIDATOR_WALLET_1: 0x3d3724d20d9d5db5a40819869057b37465a0c67d
      VALIDATOR_WALLET_2: 0xb94185491c78e7331c5d53e9b0df74970b3c9b8a
      VALIDATOR_WALLET_3: 0xb23c61d8506d1cfbc27d56834e6d684b8ee24f01
    steps:
      - name: Check required signing secret
        shell: bash
        run: |
          if [[ -z "$DEPLOYER_PRIVATE_KEY" ]]; then
            echo "::error::Missing repository Actions secret ENUGU_DEPLOYER_PRIVATE_KEY."
            exit 1
          fi
          echo "Signing secret is present; it will not be printed."
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile contract source
        run: npm run compile
      - name: Deploy, configure validators, and transfer ownership
        run: npm run deploy:enugu
