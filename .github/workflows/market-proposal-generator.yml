name: Market Proposal Generator

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-proposal-generator
  cancel-in-progress: false

jobs:
  generate-candidate:
    if: ${{ vars.MARKET_PROPOSAL_GENERATOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build
      - name: Generate one category candidate batch
        run: npm run automate:market-proposals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MARKET_PROPOSAL_GENERATOR_ENABLED: "true"
          MARKET_GENERATION_TEMPLATES_JSON: ${{ secrets.MARKET_GENERATION_TEMPLATES_JSON }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
